name: ASMR Factory - Stage 4 Visual Assets

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asmr-stage4-visual-assets
  cancel-in-progress: false

jobs:
  generate-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Google API
        run: npm install googleapis

      - name: Generate production visual assets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: node scripts/stage4-generate-assets.mjs

      - name: Upload Stage 4 visual assets
        uses: actions/upload-artifact@v4
        with:
          name: stage4-production-assets
          path: output/stage4-assets/
          if-no-files-found: error
          retention-days: 1
