name: ASMR Factory - Stage 4 Image Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asmr-stage4-image-test
  cancel-in-progress: false

jobs:
  generate-test-image:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate one Cloudflare FLUX test image
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/stage4-test-image.mjs

      - name: Upload generated test image
        uses: actions/upload-artifact@v4
        with:
          name: stage4-test-image
          path: output/stage4-test.jpg
          if-no-files-found: error
          retention-days: 1
